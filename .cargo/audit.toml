[advisories]
ignore = [
    "RUSTSEC-2025-0009", # ring v0.16.20 — stale lockfile entry (rcgen v0.11.3 -> ring 0.16).
    # https://rustsec.org/advisories/RUSTSEC-2025-0009
    # Nothing in the workspace actually depends on this chain (`cargo tree` confirms it).
    # It remains in Cargo.lock because Cargo resolves optional dependencies in the lockfile.
    # Cannot be updated: rcgen 0.11.x requires ring 0.16.x.
    "RUSTSEC-2025-0055", # tracing-subscriber v0.2.25 via ark-relations v0.4.0
    # (ark-relations unconditionally enables tracing-subscriber 0.2.x with its std feature).
    # https://rustsec.org/advisories/RUSTSEC-2025-0055
    # This is an upstream arkworks issue; no patched version of ark-relations avoids it.
    "RUSTSEC-2025-0118", # wasmtime v35.0.0 — shared memory thread safety issue.
    # https://rustsec.org/advisories/RUSTSEC-2025-0118 ->
    # https://github.com/bytecodealliance/wasmtime/security/advisories/GHSA-hc7m-r6v8-hg9q
    # "Embeddings which do not use the wasm threads proposal nor created shared memories
    # nor actually share shared memories across threads are unaffected."
    # We fall in the case where we don't use wasm threads at all.
    "RUSTSEC-2026-0006", # wasmtime v35.0.0 — segfault with f64.copysign on x86-64.
    # https://rustsec.org/advisories/RUSTSEC-2026-0006 ->
    # https://github.com/bytecodealliance/wasmtime/security/advisories/GHSA-vc8c-j3xm-xj73
    # The vulnerability only triggers when signals-based-traps is DISABLED in the wasmtime Config.
    # Substrate's sc-executor-wasmtime uses wasmtime::Config::new() which has signals_based_traps
    # enabled by default, and never disables it. Therefore this code path is never exercised.
    "RUSTSEC-2026-0020", # wasmtime v35.0.0 — WASI path traversal.
    # https://rustsec.org/advisories/RUSTSEC-2026-0020 ->
    # https://github.com/bytecodealliance/wasmtime/security/advisories/GHSA-852m-cvvp-9p4w
    # "Wasmtime's implementations of WASIp1 and WASIp2 are affected by this vulnerability."
    # We use wasmtime exclusively as a Wasm executor for Substrate PVF/runtime blobs via
    # sc-executor-wasmtime. Neither wasmtime-wasi nor any WASI context is present in our
    # dependency tree, so we are unaffected.
    "RUSTSEC-2026-0021", # wasmtime v35.0.0 — WASI HTTP fields resource issue.
    # https://rustsec.org/advisories/RUSTSEC-2026-0021 ->
    # https://github.com/bytecodealliance/wasmtime/security/advisories/GHSA-243v-98vx-264h
    # "Specific to implementations using the wasi:http/types.fields resource in wasmtime-wasi-http."
    # We do not use wasmtime-wasi-http (not present in Cargo.lock) — wasmtime is used only for
    # Substrate PVF/runtime Wasm execution, so we are unaffected.
    "RUSTSEC-2026-0269", # HIGH — WASI filesystem sandbox escape with trailing slashes.
    # https://rustsec.org/advisories/RUSTSEC-2026-0269 ->
    # https://github.com/bytecodealliance/wasmtime/security/advisories/GHSA-vqjp-4c8c-hfgg
    # Per the advisory: "Wasmtime's filesystem implementation provided in the `wasmtime-wasi` crate
    # contained a bug which allowed guests to escape their filesystem sandbox". The root cause is
    # the cap-std advisory GHSA-hp8f-xmx4-4qrg. Neither `wasmtime-wasi` nor `cap-std` (nor
    # `wasi-common`) is present in Cargo.lock: sc-executor-wasmtime v0.43.0 pulls wasmtime with
    # `default-features = false` and only the addr2line/cache/cranelift/demangle/gc/gc-null/
    # parallel-compilation/pooling-allocator/profiling/threads features — no WASI at all. wasmtime
    # is used exclusively to execute Substrate PVF/runtime Wasm blobs, which get no filesystem
    # access whatsoever. Unaffected.
    # No patched 35.x release exists (fixes are in 24.0.13/36.0.14/46.0.3/47.0.4) and
    # sc-executor-wasmtime 0.43.0 requires wasmtime "35.0.0", pinned by polkadot-sdk stable2512.
    "RUSTSEC-2026-0114", # wasmtime v35.0.0 — panic when allocating oversized table (MEDIUM, DoS only).
    # https://rustsec.org/advisories/RUSTSEC-2026-0114 ->
    # https://github.com/bytecodealliance/wasmtime/security/advisories/GHSA-p8xm-42r7-89xg
    # Arithmetic overflow panic when a Wasm module declares a table with an extremely large size,
    # leveraging the memory64 proposal's 64-bit range. Requires the on-demand allocator and
    # memory64 to be enabled. Substrate runtime Wasm blobs are compiled for wasm32 and are
    # governance-controlled (not attacker-supplied). PVF validation only runs Wasm from registered
    # parachains. This is a DoS (panic), not a sandbox escape. Unaffected in practice.
    "RUSTSEC-2026-0095", # CRITICAL — Winch sandbox-escaping memory access.
    # https://github.com/bytecodealliance/wasmtime/security/advisories/GHSA-4w5r-mg47-r5m2
    # Winch backend only — we use Cranelift. Unaffected.
    "RUSTSEC-2026-0089", # MEDIUM — Host panic when Winch executes `table.fill`.
    # https://github.com/bytecodealliance/wasmtime/security/advisories/GHSA-q49f-xg75-m9xw
    # Winch backend only — we use Cranelift. Unaffected.
    "RUSTSEC-2026-0094", # MEDIUM — Improperly masked return value from `table.grow` with Winch.
    # https://github.com/bytecodealliance/wasmtime/security/advisories/GHSA-f984-pcp8-v2p7
    # Winch backend only — we use Cranelift. Unaffected.
    "RUSTSEC-2026-0086", # LOW — Host data leakage with 64-bit tables and Winch.
    # https://github.com/bytecodealliance/wasmtime/security/advisories/GHSA-m9w2-8782-2946
    # Winch backend only — we use Cranelift. Unaffected.
    "RUSTSEC-2026-0093", # MEDIUM — Heap OOB read in component model UTF-16 string transcoding.
    # https://github.com/bytecodealliance/wasmtime/security/advisories/GHSA-394w-hwhg-8vgm
    # Component model only. Unaffected.
    "RUSTSEC-2026-0091", # MEDIUM — OOB write or crash transcoding component model strings.
    # https://github.com/bytecodealliance/wasmtime/security/advisories/GHSA-394w-hwhg-8vgm
    # Component model only. Unaffected.
    "RUSTSEC-2026-0092", # MEDIUM — Panic transcoding misaligned component model UTF-16 strings.
    # https://github.com/bytecodealliance/wasmtime/security/advisories/GHSA-jxhv-7h78-9775
    # Component model only. Unaffected.
    "RUSTSEC-2026-0085", # MEDIUM — Panic when lifting `flags` component value.
    # https://github.com/bytecodealliance/wasmtime/security/advisories/GHSA-m758-wjhj-p3jq
    # Component model only. Unaffected.
    "RUSTSEC-2026-0096", # CRITICAL — Miscompiled guest heap access on aarch64 Cranelift.
    # https://github.com/bytecodealliance/wasmtime/security/advisories/GHSA-jhxm-h53p-jm7w
    # Requires ALL of: (1) 64-bit Wasm linear memory (`Config::wasm_memory64` enabled),
    # (2) Spectre mitigations or signals-based traps disabled, (3) aarch64 architecture.
    # Substrate runtimes use 32-bit Wasm linear memories and do not enable `wasm_memory64`,
    # so the miscompiled load pattern is never generated. Unaffected.
    "RUSTSEC-2026-0088", # LOW — Data leakage between pooling allocator instances.
    # https://github.com/bytecodealliance/wasmtime/security/advisories/GHSA-6wgr-89rj-399p
    # Per the advisory: "Wasmtime is not vulnerable to this issue with its default settings."
    # Requires non-default pooling allocator configuration with `memory_guard_size` = 0 and
    # `memory_reservation` < 4 GiB. Substrate does not use the pooling allocator. Unaffected.
    "RUSTSEC-2026-0087", # MEDIUM — Segfault with `f64x2.splat` on Cranelift x86-64.
    # https://github.com/bytecodealliance/wasmtime/security/advisories/GHSA-qqfj-4vcm-26hv
    # Requires ALL of: (1) x86-64 without SSE3 (SSE3 has been universal since 2004),
    # (2) `signals_based_traps` disabled with guard pages enabled, (3) guest executes
    # `f64x2.splat` SIMD instruction. Substrate runtime Wasm does not use SIMD, and any
    # x86-64 CPU from the last 20 years has SSE3. Unaffected.
    "RUSTSEC-2026-0222", # LOW — Stores can mix up type indices between engines.
    # https://rustsec.org/advisories/RUSTSEC-2026-0222 ->
    # https://github.com/bytecodealliance/wasmtime/security/advisories/GHSA-hgjw-h833-99q9
    # Per the advisory: "Embedders using a single Engine for the lifetime of the process are not
    # affected. Embedders not directly calling one of the affected methods are not affected."
    # Guest Wasm cannot trigger this — it requires embedder code that hands an object created by
    # one Engine to a Store created by another. Nothing in the workspace uses wasmtime directly;
    # the only consumer is sc-executor-wasmtime v0.43.0, where each `WasmtimeRuntime` owns a single
    # `Engine` and its `Module`/`InstancePre` are built from that same `Engine`; `InstanceWrapper`
    # then does `Store::new(engine, ..)` + `instance_pre.instantiate(&mut store)` with that same
    # cloned `Engine` (runtime.rs:82,146 / instance_wrapper.rs:131). Engines are never mixed. The
    # other affected APIs (`Tag::new`, `StructRefPre`/`ArrayRefPre`/`ExnRefPre::new`,
    # `Store::debug_register_module`/`_component`, breakpoint edits) are never called. Unaffected.
    # No patched 35.x release exists (fixes are in 24.0.12/36.0.13/46.0.2/47.0.3) and
    # sc-executor-wasmtime 0.43.0 requires wasmtime "35.0.0", pinned by polkadot-sdk stable2512.
    "RUSTSEC-2026-0002", # lru v0.12.5 — used by libp2p-identify v0.45.0 and libp2p-swarm v0.45.1
    # (polkadot-sdk transitive dependency via libp2p v0.54.1).
    # https://rustsec.org/advisories/RUSTSEC-2026-0002
    # We checked the libp2p-identify code at v0.45.0 and libp2p-swarm at v0.45.1:
    # no mutable iterator (IterMut) is used on lru::LruCache, so the unsound code path
    # is never exercised.
    "RUSTSEC-2026-0098", # rustls-webpki v0.101.7 — URI name constraints incorrectly accepted.
    # https://rustsec.org/advisories/RUSTSEC-2026-0098 ->
    # https://github.com/advisories/GHSA-965h-392x-2mh5
    # Name constraints for URI names were ignored and therefore accepted. Exploitation requires
    # both a valid certificate signature AND deliberate certificate misissuance by a CA.
    "RUSTSEC-2026-0099", # rustls-webpki v0.101.7 — wildcard name constraint bypass.
    # https://rustsec.org/advisories/RUSTSEC-2026-0099 ->
    # https://github.com/advisories/GHSA-xgp8-3hg3-c2mh
    # A name constraint like `accept.example.com` could be bypassed by a wildcard certificate
    # `*.example.com`. Exploitation requires both a valid certificate signature AND deliberate
    # certificate misissuance by a CA.
    "RUSTSEC-2026-0104", # rustls-webpki v0.101.7 — panic in CRL parsing.
    # https://rustsec.org/advisories/RUSTSEC-2026-0104 ->
    # https://github.com/advisories/GHSA-82j2-j2ch-gfr8
    # Reachable panic when parsing a CRL with an empty BIT STRING in `onlySomeReasons`. This is a
    # DoS vulnerability affecting only applications that actively use CRLs. We never configure CRL
    # revocation checking (no `.with_crls()` calls) — the CRL parsing code is never reached.
    "RUSTSEC-2026-0097", # rand v0.8.5 — unsound aliased &mut via thread_rng() reseeding with custom logger.
    # https://rustsec.org/advisories/RUSTSEC-2026-0097 ->
    # https://github.com/rust-random/rand/pull/1763
    # The vulnerability requires the `log` optional feature to be enabled in rand (so that
    # internal log!() calls compile in and can trigger reentrant thread_rng() access from a
    # custom logger). In our build, `log` is NOT enabled for rand 0.8.5 — confirmed via
    # `cargo tree -p rand@0.8.5 -e features`: only alloc, default, getrandom, libc,
    # rand_chacha, std, std_rng are active. Without `log`, the logging code paths are
    # compiled out and the unsound aliased mutable reference can never be constructed.
    # rand 0.8.5 has no patched 0.8.x release; it is a transitive dep from arkworks
    # (ark-std), polkadot-sdk, plonky2, and sp1, none of which have moved to rand >=0.9.
    # (rand 0.9.x was updated to 0.9.4 which is patched.)
    "RUSTSEC-2026-0119", # hickory-proto v0.24.4 and v0.25.2 — O(n^2) CPU exhaustion in DNS message encoding.
    # https://rustsec.org/advisories/RUSTSEC-2026-0119 ->
    # https://github.com/hickory-dns/hickory-dns/security/advisories/GHSA-q2qq-hmj6-3wpp
    # MODERATE severity DoS via crafted DNS messages with many records triggering quadratic name
    # compression. v0.24.4 comes from libp2p-dns -> hickory-resolver (polkadot-sdk via
    # sc-telemetry -> libp2p 0.54.1). v0.25.2 comes from litep2p -> hickory-resolver
    # (polkadot-sdk via sc-network -> litep2p 0.9.5). Fix is in 0.26.1; no patched 0.24.x or
    # 0.25.x exists, and parent crates are pinned by polkadot-sdk stable2512.
    "RUSTSEC-2026-0118", # hickory-proto v0.25.2 — NSEC3 closest-encloser proof validation unbounded loop.
    # https://rustsec.org/advisories/RUSTSEC-2026-0118 ->
    # https://github.com/hickory-dns/hickory-dns/security/advisories/GHSA-3v94-mw7p-v465
    # HIGH severity DoS affecting DNSSEC validation. Requires `DnssecDnsHandle` with
    # `dnssec-ring` or `dnssec-aws-lc-rs` feature enabled. In our build, hickory-proto 0.25.2
    # has only `futures-io` and `std` features enabled — no DNSSEC features are active
    # (`cargo tree -p hickory-proto@0.25.2 -e features` confirms this). The DNSSEC validation
    # code is not compiled, so the vulnerable code path is unreachable. Unaffected.
    "RUSTSEC-2026-0186", # memmap2 v0.5.10 — unchecked pointer offset in advise/flush range functions.
    # https://rustsec.org/advisories/RUSTSEC-2026-0186
    # Unsoundness: out-of-bounds offset/len passed to advise_range/flush_range/flush_async_range/
    # unchecked_advise_range reach pointer arithmetic handed to syscalls (pointer is not
    # dereferenced). Fixed in memmap2 0.9.11. The 0.5.10 copy comes from parity-db v0.4.13
    # (polkadot-sdk transitive via sc-client-db -> parity-db), which requires memmap2 ^0.5 and
    # has no 0.4.x release on the patched line; parity-db 0.4.13 is pinned by polkadot-sdk
    # stable2512. (The other memmap2 copy, 0.9.x, was updated to 0.9.11.)
    # Verified against the parity-db 0.4.13 source: the ONLY affected function it calls is
    # MmapMut::flush_range, once, in Index::flush() (src/index.rs:605):
    #   map.flush_range(META_SIZE, map.len() - META_SIZE)
    # The advise_range/unchecked_advise_range/flush_async_range functions are never used
    # (parity-db does madvise via a raw libc::madvise call, not the memmap2 wrapper). The
    # flush_range range is in-bounds by construction: the index file is always created at
    # file_size = total_entries(index_bits) * 8 + META_SIZE (META_SIZE is a 16 KiB constant),
    # so [META_SIZE, map.len()) is exactly the map minus its header. Both arguments are pure
    # functions of the local index geometry, never of transaction/proof/block/network data, so a
    # remote attacker has no path to the out-of-bounds trigger. (The only theoretical trigger is a
    # locally truncated index file making map.len() < META_SIZE underflow the len — this needs
    # local DB write access, which is outside the remote threat model.)
    "RUSTSEC-2026-0258", # h2 v0.3.27 — unbounded empty DATA frames (DoS).
    # https://rustsec.org/advisories/RUSTSEC-2026-0258
    # Stale lockfile entry: the only path to h2 0.3.x is igd-next -> hyper v0.14.32 -> h2 ^0.3,
    # and igd-next is pulled in only by libp2p-upnp, i.e. libp2p 0.54.1's optional `upnp` feature,
    # which we do not enable. `cargo tree -i h2@0.3.27` / `-i hyper@0.14.32` / `-i libp2p-upnp`
    # all report "nothing to print" (even with --target all --edges all): none of these crates are
    # ever compiled. They remain in Cargo.lock because Cargo resolves optional dependencies there.
    # Cannot be updated anyway: 0.3.27 is the last 0.3.x release, the fix is only in >=0.4.16, and
    # hyper 0.14.x requires h2 ^0.3. (The h2 copy that is actually built, used by hyper 1.8.1, was
    # updated to 0.4.17, which is patched.)
    "RUSTSEC-2026-0253", # lru v0.7.8 and v0.12.5 — `LruCache::pop()` is not panic-safe (unsound).
    # https://rustsec.org/advisories/RUSTSEC-2026-0253 ->
    # https://github.com/jeromefroe/lru-rs/pull/238
    # If the key's `Drop` panics during `pop()`, `detach()` is skipped and a dangling node stays
    # linked in the LRU list, so a later eviction writes to freed memory. Per the advisory the UB
    # "can be invoked in safe Rust, but only if unwinding panics are enabled and
    # `std::panic::catch_unwind` is used with key types that have potentially-panicking `Drop`
    # implementations". Only patched in lru >= 0.18.2; both copies here are polkadot-sdk stable2512
    # transitive deps with no patched 0.7.x/0.12.x release.
    # - lru 0.7.8 comes from tracing-log v0.2.0 (`interest-cache` feature, enabled by
    #   sc-tracing v44.0.0). Its cache is `LruCache<Key, u64, ahash::RandomState>` where `Key` is
    #   `#[derive(Copy)] struct Key { target_address: usize, level_and_length: usize }`, so the key
    #   has a trivial no-op drop. Moreover `pop()` is never called: interest_cache.rs only uses
    #   `cap()`, `get()` and `put()` (lines 172, 204, 226). The affected function is unreachable.
    # - lru 0.12.5 comes from libp2p-swarm v0.45.1 and libp2p-identify v0.45.0 (libp2p v0.54.1).
    #   libp2p-identify does not reference lru anywhere in its sources. libp2p-swarm has exactly one
    #   `pop()` call, in behaviour/peer_addresses.rs:81 (`addrs.pop(&address)`), on an inner
    #   `LruCache<Multiaddr, ()>`. `Multiaddr` is `struct Multiaddr { bytes: Arc<Vec<u8>> }` with no
    #   `Drop` impl (multiaddr 0.18.2), so dropping the key cannot panic. Neither consumer wraps a
    #   `pop()` in `catch_unwind`. Unaffected.
]
informational_warnings = ["unmaintained", "yanked"]

[output]
deny = ["unsound"]
quiet = false
show_tree = false
