[package]
name = "kimchi-fixture-generator"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
ark-serialize = { version = "0.5.0" }
bincode = { version = "2", default-features = false, features = ["alloc", "serde", "std"] }
kimchi = { git = "https://github.com/o1-labs/proof-systems", tag = "0.7.0", default-features = false, features = ["prover"] }
num-bigint = "0.4"
rand_chacha = { version = "0.3" }
rand_core = { version = "0.6" }

[patch.crates-io]
bcs = { git = "https://github.com/o1-labs/bcs", rev = "d9c996b0" }
