name: Feature Propagation

run-name: "Workflow CI/CD Steps: feature propagation"

on:
  workflow_call:
  workflow_dispatch:

jobs:
  feature-propagation:
    runs-on: warp-ubuntu-latest-x64-2x
    name: Feature propagation
    steps:
      - name: Git checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Features
        uses: ./.github/actions/cmd-in-docker
        with:
          command: "zepter run --config .cargo/zepter-ci.yaml 2>&1 | tee features_output.txt"
          use_cache: 'no'
          cargo_binaries_install: zepter

      - name: Upload feature propagation output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: feature-propagation-output
          path: features_output.txt
          retention-days: 1
          compression-level: 0
          overwrite: true
